<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-labelledby="t d">
  <title id="t">Michele Ventimiglia, Senior AI Engineer</title>
  <desc id="d">Banner with a small neural network drawing. Agentic AI, GenAI and physical AI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b0581c"/>
      <stop offset="1" stop-color="#4e2710"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd7b3" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffd7b3" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd7b3" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffd7b3" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .n { fill: #ffffff; animation: pulse 3.2s ease-in-out infinite; }
    .l { stroke: #ffffff; stroke-opacity: 0.22; stroke-width: 1; }
    .flow { stroke: #ffd7b3; stroke-width: 1.6; stroke-linecap: round; stroke-dasharray: 6 150; animation: flow 4s linear infinite; fill: none; opacity: .9; }
    @keyframes pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
    @keyframes flow { from { stroke-dashoffset: 156; } to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .n, .flow { animation: none; } .n { opacity: .9; } .flow { display: none; } }
  </style>
  <rect width="1200" height="280" rx="18" fill="url(#bg)"/>
  <ellipse cx="950" cy="140" rx="300" ry="160" fill="url(#halo)"/>
  <g>
